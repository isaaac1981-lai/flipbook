<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陶作選品・小店立體繪本</title>
<!-- 分支發想：單獨一本立體書，不含網站的導覽和文案。正式首頁仍是 index.html。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/popup/popup.css">
<script src="assets/works.js"></script>
</head>
<body>
<main class="stage" id="stage" data-time="day">
  <span class="clock" id="clock" aria-label="現在時間"></span>
  <section class="hero-book" aria-label="陶作選品小店立體繪本">
    <div class="pop" id="pop"><div class="scaler"><div class="persp">
      <div class="book" id="book">
        <div class="sh-soft"></div>
        <div class="sh-cast" id="cast"></div>
        <div class="board lit"></div>
        <div class="edge e-front lit"></div><div class="edge e-side e-l lit"></div><div class="edge e-side e-r lit"></div>

        <div class="front">
          <div class="paper lit"></div>
          <div class="floor" data-page="1">
          <svg class="lit" viewBox="0 0 1175 762" aria-hidden="true">
            <!-- 人行道 -->
            <path class="ink fat" d="M-6 196c120-5 250 4 392 0s262 5 400 1 268-4 395 1"/>
            <path class="ink fat" d="M-6 236c160 5 300-3 446 1s300 4 440 0 210-3 301 2"/>
            <path class="ink fat" d="M-6 520c140-5 290 5 430 1s300-5 452 0 200 4 305-1"/>
            <path class="ink" d="M190 240c-6 90-14 180-26 276M470 240c-3 96-6 190-10 277M748 241c3 92 5 186 8 276M1020 240c8 96 16 190 24 276"/>
            <!-- 小草 -->
            <g class="ink"><path d="M236 168c-4-30-12-52-26-66M240 168c0-36 2-62 6-84M244 168c6-28 16-46 30-56"/>
              <path d="M318 400c-6-34-16-58-32-74M323 400c0-42 2-72 8-98M328 400c8-32 20-52 36-64"/>
              <path d="M924 706c-6-36-18-62-36-80M930 706c0-46 2-78 8-106M936 706c8-34 22-58 40-70"/>
              <path d="M112 700c-6-34-16-56-32-72M117 700c0-40 2-70 8-94M122 700c8-30 18-50 34-60"/></g>
            <!-- 店門口的踏墊 -->
            <g class="ink thin"><rect x="776" y="92" width="160" height="62" rx="9"/><path d="M794 123l14-16 14 16 14-16 14 16 14-16 14 16 14-16 14 16"/></g>
            <!-- 粉筆畫的跳房子 -->
            <g class="chalk"><path d="M579 500h60v-76h-60ZM579 462h60M549 424h120v-38h-120ZM609 424v-38M579 386h60v-38h-60ZM549 348h120v-38h-120ZM609 348v-38M565 310a44 40 0 0 1 88 0"/></g>
            <g class="num"><text x="609" y="494" transform="translate(0 -1)">1</text><text x="609" y="455">2</text><text x="579" y="417">3</text><text x="639" y="417">4</text><text x="609" y="379">5</text><text x="579" y="341">6</text><text x="639" y="341">7</text></g>
            <!-- 小孩用粉筆畫在地上的塗鴉，旁邊丟著兩支粉筆 -->
            <g class="chalk">
              <path d="M820 330c-18-30-52-6-30 22l30 34 30-34c22-28-12-52-30-22Z"/>
              <path d="M930 300l9 26 28 2-22 17 8 27-23-16-23 16 8-27-22-17 28-2Z"/>
              <path d="M886 452c0-10 14-10 14 2s-26 14-26-6 38-22 38 8-52 28-52-10"/>
              <path d="M968 440a22 26 0 1 0 .1 0M968 404v-14M968 480v14M938 440h-14M998 440h14M947 414l-9-11M989 414l9-11M947 468l-9 11M989 468l9 11"/>
              <path d="M790 478l34-10M840 500l30 12" style="stroke-width:11"/>
            </g>
            <!-- 人孔蓋 -->
            <g class="ink thin"><ellipse cx="330" cy="640" rx="60" ry="64"/><ellipse cx="330" cy="640" rx="44" ry="47"/><path d="M300 606l60 68M360 606l-60 68M330 593v94M286 640h88"/></g>
            <!-- 龍蝦走過的腳印 -->
            <g class="dk"><circle cx="556" cy="672" r="5"/><circle cx="580" cy="648" r="5"/><circle cx="606" cy="676" r="5"/><circle cx="630" cy="650" r="5"/><circle cx="658" cy="674" r="5"/><circle cx="680" cy="646" r="5"/><circle cx="708" cy="670" r="5"/></g>
          </svg>
          <div class="contact"></div>
          <div class="spill"></div>
          </div>
        </div>

        <!-- 後頁：正面印店的骨架和天空，背面是封面 -->
        <div class="bp" id="bp">
          <div class="bp-board lit"></div>
          <div class="bp-cover lit">
            <div class="label">
              <img class="lg" src="assets/line/logo.png" alt="小孩畫畫媽媽制器">
              <p>陶作選品・小店立體繪本</p>
              <img class="lb" src="assets/line/lobster.png" alt="">
            </div>
          </div>
          <div class="bp-front">
            <div class="paper lit"></div>
            <div class="wall" data-page="1">
            <img class="shop lit" src="assets/popup/back.png" alt="">
            <svg class="sky lit" viewBox="0 0 1175 762" aria-hidden="true">
              <g class="ink thin">
                <path d="M118 84c-26 2-34-30-8-36 0-24 34-32 46-12 14-16 44-6 40 16 24-2 30 30 4 32Z"/>
                <path d="M520 62c-20 2-26-22-6-28 2-20 30-24 38-8 14-10 34 0 30 16 18 2 18 22-2 22Z"/>
                <path d="M792 90c-16 0-20-18-4-22 2-16 24-18 30-6 12-8 28 2 24 14 14 2 12 16-4 16Z"/>
                <g class="sun"><circle cx="1010" cy="56" r="19"/>
                  <path d="M1010 22v-12M1010 90v12M976 56h-12M1044 56h12M986 32l-9-9M1034 32l9-9M986 80l-9 9M1034 80l9 9"/></g>
              </g>
            </svg>
            <svg class="sky-night" viewBox="0 0 1175 762" aria-hidden="true">
              <path class="moon" d="M1022 26a34 34 0 1 0 22 58a28 28 0 0 1-22-58Z"/>
              <path class="star" d="M300 40v20M290 50h20M660 26v16M652 34h16M905 70v14M898 77h14M430 86v12M424 92h12M1120 96v14M1113 103h14"/>
            </svg>
            <div class="glow"></div>
            </div>
          </div>
        </div>

        <!-- 翻頁用的那一張：平放時朝上的是前一頁的地面，立起來朝前的是下一頁的牆面 -->
        <div class="turner" id="turner"><div class="tu"><div class="paper lit"></div></div><div class="td"><div class="paper lit"></div></div></div>

        <!-- 層架上的作品紙卡由 Popup.build() 插在這裡（第一～三排，depth 8／16／26） -->

        <!-- 店主女孩（depth 34） -->
        <div class="pcard" id="card-girl" data-layer="girl" data-left="732" data-top="327" data-w="237" data-h="309.5">
          <img class="rear" alt="">
          <div class="face"><button type="button" class="girl" id="girl" aria-label="顧店的陶藝家"><img class="piece lit" src="assets/popup/girl.png" alt=""></button></div>
        </div>
        <!-- 櫃台＋檯面上的筆筒、碗、小盒子＋小蟲標誌（depth 56） -->
        <div class="pcard clip" data-layer="counter" data-left="640" data-top="452" data-w="428" data-h="315">
          <img class="rear" alt="">
          <div class="face"><img class="piece lit" src="assets/popup/counter.png" alt="">
            <button type="button" class="egg lit" id="egg" aria-label="品牌龍蝦"><img src="assets/line/lobster.png" alt=""></button></div>
        </div>
        <!-- 遮雨棚＋注音招牌＋小燈泡（depth 78）；data-raise：往上提一點，從正面看才會剛好蓋在柱子頂端 -->
        <div class="pcard" data-layer="awning" data-left="32" data-top="112" data-w="1111" data-h="214" data-raise="53">
          <img class="rear" alt="">
          <div class="face">
            <svg class="wire lit" id="wire" viewBox="0 0 1111 260" aria-hidden="true"></svg>
            <img class="piece lit" src="assets/popup/awning.png" alt="">
            <img class="sign lit" src="assets/line/logo.png" alt="">
            <svg class="wire bulbs" id="bulbs" viewBox="0 0 1111 260" aria-hidden="true"></svg>
          </div>
        </div>

        <!-- 前頁上會立起來的小東西（data-depth：離書脊多遠） -->
        <div class="pcard prop" data-depth="150" data-left="52" data-w="116" data-h="146">
          <div class="face"><svg class="lit" viewBox="0 0 110 140" aria-hidden="true">
            <defs><g id="p-sign"><path d="M18 114l-5 22M92 114l5 22" fill="none"/><path d="M24 8h62l11 106H13Z"/></g></defs>
            <use href="#p-sign" class="pe"/><use href="#p-sign" class="pi"/>
            <text class="tx" x="55" y="52" text-anchor="middle">營業中</text>
            <path class="chalk" style="stroke-width:3.5" d="M55 76c-7-12-20-2-12 9l12 13 12-13c8-11-5-21-12-9Z"/>
          </svg></div>
        </div>
        <div class="pcard prop" data-depth="104" data-left="556" data-w="76" data-h="104">
          <div class="face"><svg class="lit" viewBox="0 0 80 110" aria-hidden="true">
            <defs><g id="p-pot1"><path d="M40 56C40 32 30 16 17 9c-2 20 8 39 23 47Z"/><path d="M40 56c2-26 12-42 25-49 2 20-9 40-25 49Z"/><path d="M40 56c-5-20-1-40 1-53 8 14 6 37-1 53Z"/><path d="M19 64h42l-6 41H25Z"/><rect x="14" y="54" width="52" height="11" rx="3"/></g></defs>
            <use href="#p-pot1" class="pe"/><use href="#p-pot1" class="pi"/>
          </svg></div>
        </div>
        <div class="pcard prop" data-depth="96" data-left="1088" data-w="66" data-h="90">
          <div class="face"><svg class="lit" viewBox="0 0 80 110" aria-hidden="true">
            <defs><g id="p-pot2"><circle cx="40" cy="26" r="20"/><circle cx="22" cy="42" r="14"/><circle cx="58" cy="42" r="14"/><path d="M19 64h42l-6 41H25Z"/><rect x="14" y="54" width="52" height="11" rx="3"/></g></defs>
            <use href="#p-pot2" class="pe"/><use href="#p-pot2" class="pi"/>
          </svg></div>
        </div>
        <div class="pcard prop" data-depth="430" data-left="1078" data-w="86" data-h="258">
          <div class="face"><svg class="lit" viewBox="0 0 90 270" aria-hidden="true">
            <defs><g id="p-lamp"><path d="M41 70h8v180h-8Z"/><path d="M28 264l7-16h20l7 16Z"/><path d="M27 30h36l-6 42H33Z"/><path d="M21 30h48l-9-13H30Z"/><circle cx="45" cy="11" r="4.5"/></g></defs>
            <use href="#p-lamp" class="pe"/><use href="#p-lamp" class="pi"/>
          </svg><svg class="lampglow" viewBox="0 0 90 270" aria-hidden="true"><circle cx="45" cy="50" r="9"/></svg></div>
        </div>
        <div class="pcard prop" data-depth="300" data-left="196" data-w="92" data-h="92">
          <div class="face"><button type="button" class="work" aria-label="路過的貓"><svg class="lit" viewBox="0 0 90 90">
            <defs><g id="p-cat"><path d="M58 80c18 2 24-14 16-24" fill="none"/><path d="M22 85C14 61 24 45 40 43c16 2 24 18 18 42Z"/><path d="M24 30c0-8 1-18 0-26l12 11c3-1 5-1 8 0L56 4c-1 8 0 18 0 26 0 10-7 17-16 17s-16-7-16-17Z"/></g></defs>
            <use href="#p-cat" class="pe"/><use href="#p-cat" class="pi"/>
            <circle class="dk" cx="34" cy="29" r="2.2"/><circle class="dk" cx="46" cy="29" r="2.2"/>
            <path class="chalk" style="stroke-width:2.5" d="M38 36q2 2 4 0M29 35l-10-2M29 38l-10 3M51 35l10-2M51 38l10 3"/>
          </svg></button></div>
        </div>
        <div class="pcard prop" data-depth="640" data-left="436" data-w="88" data-h="90">
          <div class="face"><button type="button" class="work" aria-label="出門散步的龍蝦"><img class="lit" src="assets/line/lobster.png" alt=""></button></div>
        </div>
      </div>
    </div></div></div>

    <!-- 社群版型（網址加 ?format=reel｜post｜square）才會出現的標題和內文 -->
    <header class="fm fm-head"><span class="fm-no" id="fm-no"></span><h1 class="fm-title" id="fm-title"></h1></header>
    <p class="fm fm-text" id="fm-text"></p>
    <div class="fm fm-guide" id="fm-guide" hidden></div>

    <p class="seen"><span id="caption">小陶最後一次出現在 <b>陶作選品小店</b>・剛剛</span></p>
    <div class="pager" role="group" aria-label="翻頁">
      <button type="button" class="arrow" id="page-prev" aria-label="上一頁"><svg viewBox="0 0 14 24"><path d="M12 2 2 12l10 10"/></svg></button>
      <span class="pages" id="pages"></span>
      <button type="button" class="arrow" id="page-next" aria-label="下一頁"><svg viewBox="0 0 14 24"><path d="m2 2 10 10L2 22"/></svg></button>
    </div>
    <div class="times" role="group" aria-label="切換時段">
      <button type="button" class="dot" data-t="day" aria-label="白天" title="白天"></button>
      <button type="button" class="dot" data-t="night" aria-label="夜晚" title="夜晚"></button>
      <span class="now" id="time-now" aria-live="polite"></span>
      <button type="button" class="replay" id="replay">重新翻開</button>
    </div>
  </section>
</main>
<script src="assets/popup/art.js"></script>
<script src="assets/popup/pages.js"></script>
<script src="assets/popup/popup.js"></script>
<script>Popup.build(window.WORKS);</script>
</body>
</html>
